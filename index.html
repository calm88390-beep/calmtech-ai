<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e1b4b'/><text x='50' y='68' font-size='55' font-family='sans-serif' font-weight='bold' fill='%2338bdf8' text-anchor='middle'>C</text></svg>">
<title>CALMTECH AI - Free Smart AI Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at top left,#1e1b4b,#090d16 55%,#06283d);color:#f8fafc;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(15,23,42,.9);border-bottom:1px solid rgba(139,92,246,.3);flex-shrink:0}
.brand{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#38bdf8,#a855f7,#ec4899,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nbtn{background:rgba(139,92,246,.25);color:#e0f2fe;border:1px solid rgba(139,92,246,.5);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;margin-left:6px}
#hp{display:none;position:fixed;top:56px;right:14px;width:270px;max-height:65vh;overflow-y:auto;background:#131936;border:1px solid #8b5cf6;border-radius:16px;padding:12px;z-index:100}
.hi{display:flex;justify-content:space-between;padding:8px 10px;margin-bottom:6px;background:#1e293b;border-radius:10px;cursor:pointer;font-size:13px}
.hi.act{border:1px solid #38bdf8}
.ad{background:#090d16;border-bottom:1px solid rgba(99,102,241,.25);min-height:54px;display:flex;align-items:center;justify-content:center;padding:4px;flex-shrink:0}
#chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin:0 auto}
.w{margin:auto;text-align:center;padding:20px}
.wt{font-size:26px;font-weight:800;margin-bottom:8px;background:linear-gradient(90deg,#38bdf8,#c084fc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chip{display:inline-block;margin:4px;background:#1e293b;border:1px solid #8b5cf6;color:#e2e8f0;padding:8px 14px;border-radius:16px;font-size:13px;cursor:pointer}
.row{display:flex;width:100%}.u{justify-content:flex-end}.b{justify-content:flex-start}
.msg{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.55;font-size:15px;word-wrap:break-word;white-space:pre-wrap}
.u .msg{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-bottom-right-radius:4px}
.b .msg{background:rgba(30,41,59,.88);color:#f1f5f9;border:1px solid rgba(148,163,184,.2);border-bottom-left-radius:4px}
.b a{color:#38bdf8;font-weight:600;text-decoration:underline}
.msg img{max-width:100%;max-height:220px;border-radius:10px;margin-bottom:6px;display:block}
.cbtn{display:inline-block;margin-top:8px;background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.4);padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.th{color:#c084fc;font-style:italic}
.bbar{background:rgba(15,23,42,.95);border-top:1px solid rgba(139,92,246,.3);padding:10px 14px 12px;flex-shrink:0}
#pbar{display:none;max-width:820px;margin:0 auto 8px;background:rgba(124,58,237,.25);border:1px solid #a855f7;padding:5px 12px;border-radius:14px;font-size:13px;justify-content:space-between;align-items:center}
.iw{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;background:#1e293b;padding:6px 8px;border-radius:28px;border:1px solid rgba(139,92,246,.5)}
#pbtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(139,92,246,.6);background:rgba(139,92,246,.3);color:#fff;font-size:20px;font-weight:700;cursor:pointer;flex-shrink:0;line-height:1}
#inp{flex:1;background:transparent;border:none;color:#fff;font-size:15px;outline:none;min-width:0}
#btn{background:linear-gradient(135deg,#06b6d4,#6366f1);color:#fff;border:none;padding:10px 20px;border-radius:22px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45}
.foot{max-width:820px;margin:8px auto 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8}
.share{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:4px 12px;border-radius:12px;text-decoration:none;font-weight:700}
</style>
<script>
var chats={},sid="u_"+Math.random().toString(36).slice(2,10),upImg=null;
try{chats=JSON.parse(localStorage.getItem("ct_chats")||"{}");}catch(e){}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(t){return esc(t).split(/(\s+)/).map(function(w){return(w.indexOf("http://")===0||w.indexOf("https://")===0)?'<a href="'+w+'" target="_blank" rel="noopener noreferrer">'+w+'</a>':w;}).join("");}
function copyTxt(btn){var box=btn.parentNode;var clone=box.cloneNode(true);var b=clone.querySelector(".cbtn");if(b)b.remove();navigator.clipboard.writeText(clone.innerText.trim());btn.textContent="Copied!";setTimeout(function(){btn.textContent="Copy";},1500);}
function save(){try{localStorage.setItem("ct_chats",JSON.stringify(chats));}catch(e){}renH();}
function togH(){var p=document.getElementById("hp");p.style.display=p.style.display==="block"?"none":"block";renH();}
function renH(){var l=document.getElementById("hl"),ids=Object.keys(chats).reverse();l.innerHTML=ids.length?ids.map(function(id){return'<div class="hi '+(id===sid?'act':'')+'" onclick="loadC(\''+id+'\')"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+esc(chats[id].t||'Chat')+'</span><span style="color:#f87171;margin-left:8px" onclick="delC(event,\''+id+'\')">×</span></div>';}).join(""):'<div style="color:#94a3b8;font-size:13px">No saved chats yet.</div>';}
function loadC(id){sid=id;document.getElementById("hp").style.display="none";var b=document.getElementById("chat");b.innerHTML="";(chats[id]&&chats[id].m||[]).forEach(function(x){b.innerHTML+=x.r==="u"?'<div class="row u"><div class="msg">'+esc(x.t)+'</div></div>':'<div class="row b"><div class="msg">'+fmt(x.t)+'<br><button type="button" class="cbtn" onclick="copyTxt(this)">Copy</button></div></div>';});b.scrollTop=b.scrollHeight;}
function delC(e,id){e.stopPropagation();delete chats[id];save();if(id===sid)newC();}
function clrImg(){upImg=null;document.getElementById("fin").value="";document.getElementById("pbar").style.display="none";}
function pickImg(e){var f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>10*1024*1024){alert("Max 10 MB image.");e.target.value="";return;}var r=new FileReader();r.onload=function(ev){var d=ev.target.result;upImg={mime:f.type,data:d.split(",")[1],url:d};document.getElementById("plbl").textContent="Attached: "+f.name;document.getElementById("pbar").style.display="flex";};r.readAsDataURL(f);}
function newC(){sid="u_"+Math.random().toString(36).slice(2,10);clrImg();document.getElementById("hp").style.display="none";document.getElementById("chat").innerHTML='<div class="w" id="w"><div class="wt">How can I help you today?</div><div style="color:#94a3b8;font-size:15px;margin-bottom:14px">Ask in English, Twi, or Pidgin — or tap + to upload a photo!</div><div><span class="chip" onclick="ask(\'Wo ho te sɛn? Kyerɛ me adwuma pa a mɛtumi ayɛ wɔ Ghana\')">Chat in Twi</span><span class="chip" onclick="ask(\'How body? Give me 5 sharp business ideas for Ghana\')">Chat in Pidgin</span><span class="chip" onclick="ask(\'Who is the current President of Ghana?\')">President of Ghana</span></div></div>';}
function ask(q){document.getElementById("inp").value=q;send();}
async function send(){var i=document.getElementById("inp"),b=document.getElementById("btn"),pb=document.getElementById("pbtn"),c=document.getElementById("chat"),t=i.value.trim();if((!t&&!upImg)||b.disabled)return;var w=document.getElementById("w");if(w)w.remove();var lbl=t||(upImg?"Analyze this image":"");if(!chats[sid])chats[sid]={t:lbl.slice(0,32),m:[]};chats[sid].m.push({r:"u",t:lbl});save();i.disabled=b.disabled=pb.disabled=true;c.innerHTML+=`<div class="row u"><div class="msg">${upImg?`<img src="${upImg.url}">`:""}${esc(lbl)}</div></div>`;var ms=upImg?{mime:upImg.mime,data:upImg.data}:null;i.value="";clrImg();const id="t"+Date.now();c.innerHTML+=`<div class="row b" id="${id}"><div class="msg th">${ms?"Analyzing photo...":"Thinking..."}</div></div>`;c.scrollTop=c.scrollHeight;try{var r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t||"Analyze this image in detail.",session_id:sid,media:ms})});var d=await r.json();chats[sid].m.push({r:"b",t:d.reply});save();document.getElementById(id).innerHTML=`<div class="msg">${fmt(d.reply)}<br><button type="button" class="cbtn" onclick="copyTxt(this)">Copy</button></div>`;}catch(e){document.getElementById(id).innerHTML=`<div class="msg">Error: ${esc(e.message)}</div>`;}i.disabled=b.disabled=pb.disabled=false;i.focus();c.scrollTop=c.scrollHeight;}
</script>
</head>
<body onload="newC()">
